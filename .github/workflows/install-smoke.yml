name: install-smoke

# The designed Windows verification: no maintainer runs a Windows box locally, so this matrix is the gate that lets the repo claim Windows support truthfully.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Seed optional Antigravity root
        shell: python
        env:
          HOME: ${{ runner.temp }}/akihome
          USERPROFILE: ${{ runner.temp }}/akihome
        run: |
          import os, pathlib
          (pathlib.Path(os.path.expanduser("~")) / ".gemini").mkdir(parents=True, exist_ok=True)

      - name: Run installer into sandbox HOME
        env:
          HOME: ${{ runner.temp }}/akihome
          USERPROFILE: ${{ runner.temp }}/akihome
        run: python install.py

      - name: Assert install manifest
        shell: python
        env:
          HOME: ${{ runner.temp }}/akihome
          USERPROFILE: ${{ runner.temp }}/akihome
        run: |
          import os, pathlib, sys
          home = pathlib.Path(os.path.expanduser("~"))
          must_exist = [
              home / ".aki" / "akidevrule" / "index.md",
              home / ".aki" / "akidevrule" / "RULE-agent-behavior.md",
              home / ".aki" / "akidevrule" / "RULE-coding.md",
              home / ".aki" / "akidevrule" / ".source-repo",
              home / ".claude" / "CLAUDE.md",
              home / ".claude" / "skills" / "akiflow" / "SKILL.md",
              home / ".claude" / "agents" / "aki-conduct.md",
              home / ".gemini" / "GEMINI.md",
              home / ".gemini" / "config" / "skills.json",
              home / ".gemini" / "config" / "rules" / "akirule-agent-behavior.md",
              home / ".gemini" / "config" / "skills" / "akiship" / "SKILL.md",
          ]
          missing = [str(p) for p in must_exist if not p.is_file()]
          if missing:
              print("MISSING after install on", sys.platform, ":", *missing, sep="\n  ")
              sys.exit(1)
          # LF discipline: no installed text file may carry CRLF.
          crlf = []
          for root in (home / ".aki" / "akidevrule", home / ".claude" / "skills"):
              for p in root.rglob("*.md"):
                  if b"\r\n" in p.read_bytes():
                      crlf.append(str(p))
          if crlf:
              print("CRLF found in installed files on", sys.platform, ":", *crlf[:20], sep="\n  ")
              sys.exit(1)

          gemini = home / ".gemini" / "GEMINI.md"
          if len(gemini.read_text(encoding="utf-8")) > 12000:
              print("GEMINI.md exceeds Antigravity 12k rule-file limit")
              sys.exit(1)

          rules = list((home / ".gemini" / "config" / "rules").glob("akirule-*.md"))
          if len(rules) != 18:
              print("Expected 18 Antigravity rules, got", len(rules))
              sys.exit(1)
          for rule in rules:
              text = rule.read_text(encoding="utf-8")
              if len(text) > 12000 or "@" not in text:
                  print("Invalid Antigravity wrapper", rule)
                  sys.exit(1)
              if "trigger: glob" in text:
                  globs = next((line for line in text.splitlines() if line.startswith("globs: ")), "")
                  if not globs or globs.startswith("globs: ["):
                      print("Glob rule must use the current Agy scalar globs shape:", rule)
                      sys.exit(1)

          import json
          skills_json = json.loads((home / ".gemini" / "config" / "skills.json").read_text(encoding="utf-8"))
          entries = [e.get("path") for e in skills_json.get("entries", []) if isinstance(e, dict)]
          if any(not pathlib.Path(p).is_absolute() for p in entries if isinstance(p, str)):
              print("Antigravity skills.json contains a non-absolute path:", entries)
              sys.exit(1)

          print("OK: manifest, Antigravity wrappers, skill roots and LF discipline clean on", sys.platform)
